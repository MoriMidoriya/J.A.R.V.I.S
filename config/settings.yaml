# J.A.R.V.I.S. settings. Any value can be overridden via env var JARVIS__SECTION__KEY (see .env.example).

assistant:
  name: Jarvis
  user_title: sir
  user_name: Mori
  wake_word: hey_jarvis          # openWakeWord pre-trained model name, or path to a custom .onnx
  wake_threshold: 0.5
  hot_window_seconds: 8          # after Jarvis replies, listen for follow-ups without the wake word
  language: en
  home_city: null                # weather default, e.g. "Pune"; null = locate by IP address

llm:
  # Any LiteLLM model string. Measured 2026-10-09 on the RTX 5070 Ti (12 GB):
  #   ollama/qwen3:8b   11/12 commands correct, ~0.3-0.6 s/turn, 5 GB VRAM  <- default (leaves room for Whisper+Kokoro+HUD on GPU)
  #   ollama/qwen3:14b  11/12 commands correct, ~0.5-0.9 s/turn, 10 GB VRAM (tight; Whisper may spill to CPU)
  #   anthropic/claude-sonnet-4-5, openai/gpt-4.1-mini, gemini/gemini-2.5-flash, groq/llama-3.3-70b-versatile (need keys in .env)
  # Evaluated and rejected 2026-10-10 (STATUS.md §10): Liquid LFM2.5 8B-A1B / 2.6B / 1.2B (33, 36, 18 of 44 tool calls vs 44/44 here).
  primary: ollama/qwen3:8b
  fast: ollama/qwen3:8b          # reserved for short internal calls (classification, summaries)
  vision: ollama/qwen2.5vl:7b    # used when an image / screenshot is attached
  fallback: null                 # e.g. anthropic/claude-sonnet-4-5 — used if primary errors/times out
  temperature: 0.6
  max_tokens: 400
  request_timeout_s: 60
  ollama_base_url: http://127.0.0.1:11434
  ollama_num_ctx: 8192
  ollama_keep_alive: 30m           # keep the model loaded in VRAM between turns
  max_tool_rounds: 6
  # Per-model overrides, keyed by model string (exact or prefix). Only needed for reasoning models that ignore `think: false`:
  #   think: off (default, Qwen3) | on (model thinks; Ollama keeps it out of the reply) | prefill (skip thinking via an empty <think> block)
  # Example (that model is NOT installed any more — `ollama pull LiquidAI/lfm2.5-2.6b` first; see STATUS.md §10.5):
  # model_opts:
  #   ollama/LiquidAI/lfm2.5-2.6b: { think: prefill, temperature: 0.1 }

stt:
  # faster-whisper large-v3-turbo kept over NVIDIA Parakeet-TDT 0.6B v3 (2026-10-10, STATUS.md §10.3): same accuracy on clean
  # speech, but Parakeet's WER doubles in noise, it has no vocabulary prompt, and its GPU build needs 3.6 GB VRAM vs 1.2 GB.
  engine: faster_whisper         # faster_whisper | moonshine | openai | groq
  model: large-v3-turbo
  device: cuda                   # cuda | cpu | auto
  compute_type: int8_float16     # int8_float16 on GPU, int8 on CPU
  beam_size: 1

tts:
  engine: kokoro                 # kokoro | elevenlabs | openai
  voice: bm_george               # kokoro voices: bm_george, bm_lewis, bm_daniel, bm_fable, bf_emma ...
  speed: 1.0
  comm_link_fx: false

audio:
  input_device: null             # null = system default; or device index/name from `jarvis doctor`
  output_device: null
  sample_rate: 16000
  frame_ms: 80
  vad_threshold: 0.5
  vad_silence_ms: 600
  max_utterance_s: 15

ui:
  enabled: true
  mode: compact                  # compact (click-through reactor in the corner) | panel (console) | cinematic (full screen)
  host: 127.0.0.1
  port: 8765
  hotkey_text_input: <ctrl>+<shift>+j
  hotkey_toggle_hud: <ctrl>+<shift>+h
  start_with_windows: false
  # Compact-mode attention behaviour: the reactor rests dimmed; "Hey Jarvis" brings it to full brightness and unfolds the
  # last lines of conversation beside it; linger_s after the turn it folds and dims again.
  idle_opacity: 0.55             # 0.1-1.0 brightness of the resting reactor
  linger_s: 8                    # seconds the conversation stays unfolded after Jarvis goes idle (0 = fold at once)
  widgets: true                  # side instruments (audio, spectrum, system, clock, globe, pipeline) in panel/cinematic
  cinematic_dim: 0.45            # 0-0.9 how much cinematic mode darkens the desktop behind it

tools:
  everything_path: C:\Program Files\Everything\Everything.exe
  allow_shell: true              # run_powershell is always behind a confirmation
  confirm_timeout_s: 15

memory:
  db_path: data/jarvis.db
  history_turns: 12        # exchanges kept in the LLM context
  resume_hours: 6          # on start, continue the conversation if the last exchange is this recent (0 = fresh every start)

logging:
  level: INFO
  file: logs/jarvis.log
