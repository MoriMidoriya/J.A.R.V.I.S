[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — voice-first local AI assistant with full PC control and an Iron Man HUD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "python-dotenv>=1",
    "loguru>=0.7",
    "rich>=13",
    "typer>=0.12",
    "httpx>=0.27",
    # server / ui bridge
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    # llm
    "litellm>=1.50",
    # audio
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "openwakeword>=0.6",
    "onnxruntime>=1.18",
    "silero-vad>=5.1",
    "faster-whisper>=1.1",
    "kokoro>=0.9",
    "torch>=2.7",
    # desktop shell
    "PySide6>=6.7",
    # pc control
    "pywin32>=306",
    "pywinauto>=0.6.8",
    "pygetwindow>=0.0.9",
    "psutil>=6",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "screen-brightness-control>=0.24",
    "rapidfuzz>=3.9",
    "mss>=9",
    "pillow>=10",
    "pyperclip>=1.9",
    "pynput>=1.7",
    "apscheduler>=3.10,<4",
    "trafilatura>=1.12",
]

[project.scripts]
jarvis = "jarvis.__main__:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
# Windows-only project: skips Linux-only transitive deps (e.g. openwakeword -> tflite-runtime).
environments = ["sys_platform == 'win32'"]

# Blackwell (RTX 50-series) needs CUDA 12.8+ builds of torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
